[project]
name = "panal"
version = "0.1.0"
description = "Cloud honeypot with an AI SOC analyst"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.4", "maxminddb>=2.6", "pyyaml>=6.0", "pycountry>=24.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pysigma>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panal"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # fake attacker passwords in fixtures
