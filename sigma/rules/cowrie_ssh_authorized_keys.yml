title: SSH Authorized Keys Modified by Attacker
id: df27c3ed-3342-4e7d-815f-4e81bf88ae54
status: experimental
description: Attacker writes to authorized_keys to keep access (persistence).
references:
    - https://github.com/Fabricioanchundia/IA-PANAL
author: Fabricio Anchundia
date: 2026-11-07
tags:
    - attack.persistence
    - attack.t1098.004
logsource:
    product: cowrie
    service: ssh
detection:
    selection:
        eventid: cowrie.command.input
        input|contains: authorized_keys
    filter_read_only:
        input|startswith:
            - 'cat '
            - 'ls '
    condition: selection and not filter_read_only
falsepositives:
    - Administrators adding their own keys
level: high
